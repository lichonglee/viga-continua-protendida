<div class="app">
  <header class="top">
    <div>
      <h1>Viga contínua protendida, 2 vãos</h1>
      <div class="sub">Pós-tração aderente · NBR 6118 · mesma lógica da planilha de apoio, recalculada a cada alteração</div>
    </div>
    <div class="status" id="status"></div>
    <a class="jump" href="#dados">Ir aos dados de entrada</a>
  </header>
  <div class="banner" id="banner" hidden></div>
  <div class="shell">
    <aside class="side" id="dados" aria-label="Dados de entrada">

      <div class="presets" id="presets"></div>
      <div id="fields"></div>
      <p class="foot">Valores em kN, m e MPa, como na planilha. Cargas g adicional e q são adotadas e provisórias.</p>
    </aside>

<script>
'use strict';
/* Motor de cálculo — viga contínua protendida de 2 vãos iguais (kN, m, MPa). Porte do motor Python/planilha. */
const DEF = {
  L: 10, bw: 0.30, h: 0.90, fck: 30, gc: 1.4, gs: 1.15,
  g_add: 13.25, q: 25, psi1: 0.4, psi2: 0.3,
  cnom: 0.035, phi_t: 0.010, d_bain: 0.061, e_end: 0, e_span: 0.28, e_sup: 0.28, lam: 1.0,
  n_cab: 2, n_cord: 5, Ap1: 0.987, fptk: 1900, Ep: 200000, rj: 0.74,
  mu: 0.20, kk: 0.002, slip: 0.006, t0: 7, phi_cr: 2.9, eps_cs: -0.00023,
  fyk: 500, Es: 210000,
  AscB: 4.91, AscV: 2.45, dsc: 0.05,
  nnegCA: 8, nposCA: 6, phiCA: 20, ddCA: 0.82, cgCA: 0.0755,
  nB1: 4, nV1: 2, phiN1: 20, nivel: 3, AstB: 0, AstV: 0
};
const BAR_AREA = {8: 0.503, 10: 0.785, 12.5: 1.227, 16: 2.011, 20: 3.142, 25: 4.909};
const barArea = ph => BAR_AREA[ph] !== undefined ? BAR_AREA[ph] : Math.PI * ph * ph / 400;
const sum = a => a.reduce((s, v) => s + v, 0);
const maxA = a => a.reduce((m, v) => v > m ? v : m, -Infinity);
const minA = a => a.reduce((m, v) => v < m ? v : m, Infinity);
function trapz(y, x) { let s = 0; for (let i = 1; i < x.length; i++) s += 0.5 * (y[i] + y[i - 1]) * (x[i] - x[i - 1]); return s; }
function interp(v, xs, ys) {
  if (v <= xs[0]) return ys[0]; if (v >= xs[xs.length - 1]) return ys[ys.length - 1];
  for (let i = 1; i < xs.length; i++) if (v <= xs[i]) return ys[i - 1] + (ys[i] - ys[i - 1]) * (v - xs[i - 1]) / (xs[i] - xs[i - 1]);
}
function bisect(f, a, b, it) {
  let fa = f(a), fb = f(b);
  if (fa === 0) return a; if (fb === 0) return b;
  if (Math.sign(fa) === Math.sign(fb)) return null;
  for (let i = 0; i < (it || 90); i++) { const m = 0.5 * (a + b), fm = f(m); if (Math.sign(fm) === Math.sign(fa)) { a = m; fa = fm; } else { b = m; fb = fm; } }
  return 0.5 * (a + b);
}

function derive(D) {
  const d = Object.assign({}, D);
  d.Ac = d.bw * d.h; d.Ic = d.bw * Math.pow(d.h, 3) / 12; d.W = d.Ic / (d.h / 2); d.k = d.W / d.Ac;
  d.g_pp = 25 * d.Ac; d.g = d.g_pp + d.g_add;
  d.dpp = d.cnom + d.phi_t + d.d_bain / 2; d.e_max = d.h / 2 - d.dpp;
  d.fcd = d.fck / d.gc; d.fctm = 0.3 * Math.pow(d.fck, 2 / 3); d.fctkinf = 0.7 * d.fctm; d.fctksup = 1.3 * d.fctm; d.fctd = d.fctkinf / d.gc;
  d.Eci = 5600 * Math.sqrt(d.fck); d.alpha_i = Math.min(0.8 + 0.2 * d.fck / 80, 1); d.Ecs = d.alpha_i * d.Eci;
  d.fcj = Math.exp(0.38 * (1 - Math.sqrt(28 / d.t0))) * d.fck; d.Eci_j = 5600 * Math.sqrt(d.fcj); d.fctmj = 0.3 * Math.pow(d.fcj, 2 / 3);
  d.ft_els = 1.2 * d.fctkinf; d.ft_ato = 1.2 * d.fctmj;
  d.Ap = d.n_cab * d.n_cord * d.Ap1 * 1e-4;
  d.fpyk = 0.9 * d.fptk; d.fpyd = d.fpyk / d.gs; d.fptd = d.fptk / d.gs; d.sig_j = d.rj * d.fptk;
  d.fyd = d.fyk / d.gs; d.pbal = d.g + d.psi2 * d.q;
  return d;
}

/* ---------- traçado ---------- */
function profileParams(d) {
  const L = d.L, lam = d.lam, em = d.e_span, es = d.e_sup, ee = d.e_end, xi = L - lam;
  const c = em - ee, A = (em + es) - c, B = c * (xi + L), C = -c * xi * L;
  const x0 = (-B + Math.sqrt(B * B - 4 * A * C)) / (2 * A);
  const aA = c / (x0 * x0), aB = aA * (xi - x0) / lam;
  return {x0, aA, aB, xi};
}
function cable(d, xs) {
  const L = d.L, pp = profileParams(d), em = d.e_span, es = d.e_sup;
  const e = [], de = [];
  for (const x of xs) {
    const s = x <= L ? x : 2 * L - x, sg = x <= L ? 1 : -1;
    let ev, dv;
    if (s <= pp.xi) { ev = em - pp.aA * (s - pp.x0) ** 2; dv = -2 * pp.aA * (s - pp.x0); }
    else { ev = -es + pp.aB * (L - s) ** 2; dv = -2 * pp.aB * (L - s); }
    e.push(ev); de.push(dv * sg);
  }
  return {e, de};
}

/* ---------- esforços externos ---------- */
function twoSpan(w1, w2, L, x) {
  const MB = -(w1 + w2) * L * L / 16, RA = w1 * L / 2 + MB / L, RC = w2 * L / 2 + MB / L;
  const M = [], V = [];
  x.forEach((xx, i) => {
    if (xx <= L + 1e-9) { M[i] = RA * xx - w1 * xx * xx / 2; V[i] = RA - w1 * xx; }
    else { const xr = 2 * L - xx; M[i] = RC * xr - w2 * xr * xr / 2; V[i] = -(RC - w2 * xr); }
  });
  return [M, V];
}
function extActions(d, x) {
  const L = d.L, g = d.g, q = d.q, g0 = d.g_pp;
  const [Mg, Vg] = twoSpan(g, g, L, x), [Mg0, Vg0] = twoSpan(g0, g0, L, x);
  const pats = [[q, q], [q, 0], [0, q]].map(p => twoSpan(p[0], p[1], L, x));
  const n = x.length, o = {Mg, Vg, Mg0, Vg0, Mq_max: [], Mq_min: [], Vq_max: [], Vq_min: []};
  for (let i = 0; i < n; i++) {
    const ms = pats.map(p => p[0][i]), vs = pats.map(p => p[1][i]);
    o.Mq_max.push(Math.max(maxA(ms), 0)); o.Mq_min.push(Math.min(minA(ms), 0));
    o.Vq_max.push(Math.max(maxA(vs), 0)); o.Vq_min.push(Math.min(minA(vs), 0));
  }
  return o;
}

/* ---------- perdas ---------- */
function relaxPsi1000(r) { return interp(r, [0.5, 0.6, 0.7, 0.8], [0, 1.3, 2.5, 3.5]) / 100; }
function losses(d) {
  const L = d.L, n = 41, dx = L / 20, x = Array.from({length: n}, (_, i) => i * dx);
  const {e, de} = cable(d, x);
  const alpha = de.map(Math.atan);
  const dtheta = alpha.map((a, i) => i ? Math.abs(a - alpha[i - 1]) : 0);
  const theta = []; dtheta.reduce((s, v, i) => (theta[i] = s + v), 0);
  const darc = e.map((v, i) => i ? Math.sqrt(dx * dx + (v - e[i - 1]) ** 2) : 0);
  const arc = []; darc.reduce((s, v, i) => (arc[i] = s + v), 0);
  const sj = d.sig_j, mu = d.mu, kk = d.kk, Ep = d.Ep;
  const sL = x.map((_, i) => sj * Math.exp(-mu * theta[i] - kk * arc[i]));
  const Th = theta[n - 1], S = arc[n - 1];
  const sR = x.map((_, i) => sj * Math.exp(-mu * (Th - theta[i]) - kk * (S - arc[i])));
  const sf = sL.map((v, i) => Math.max(v, sR[i]));
  const cum = [0]; for (let i = 1; i < n; i++) cum[i] = cum[i - 1] + 0.5 * (sL[i] + sL[i - 1]) * dx;
  const delta_k = cum.map((c, i) => 2 * (c - sL[i] * x[i]) / Ep);
  const dk = delta_k.slice(0, 21), slip = d.slip;
  let k = dk.findIndex(v => v >= slip), xa, sfa;
  if (k < 0) { xa = L; sfa = sL[20]; }
  else if (k === 0) { xa = 0; sfa = sL[0]; }
  else { const f = (slip - dk[k - 1]) / (dk[k] - dk[k - 1]); xa = x[k - 1] + f * (x[k] - x[k - 1]); sfa = sL[k - 1] + f * (sL[k] - sL[k - 1]); }
  const half = []; for (let i = 0; i <= 20; i++) half.push(x[i] <= xa ? 2 * sfa - sL[i] : sL[i]);
  const sas = half.concat(half.slice(0, 20).reverse());
  const ext = extActions(d, x), Mg0 = ext.Mg0;
  const ap = Ep / d.Eci_j, ncab = d.n_cab, Ac = d.Ac, Ic = d.Ic, Ap = d.Ap;
  const cES = ncab > 1 ? ap * (ncab - 1) / (2 * ncab) : 0;
  const des = [], sig_i = [], Pi = [], scp0 = [];
  for (let i = 0; i < n; i++) {
    const gfac = Ap * (1 / Ac + e[i] * e[i] / Ic);
    const dd = Math.max(cES * (gfac * sas[i] - Mg0[i] * e[i] / Ic / 1e3) / (1 + cES * gfac), 0);
    des.push(dd); sig_i.push(sas[i] - dd); Pi.push(Ap * (sas[i] - dd) * 1e3);
    scp0.push(-Pi[i] / Ac / 1e3 - Pi[i] * e[i] * e[i] / Ic / 1e3 + Mg0[i] * e[i] / Ic / 1e3);
  }
  const phi = d.phi_cr, ecs = d.eps_cs, ap28 = Ep / d.Ecs, rho_p = Ap / Ac;
  const psi1000 = [], chi = [], eta = [], dsig = [], sig_inf = [];

/* ---------- cabeçalho de situação ---------- */
function levelOf(){ return A.lv.N3 ? 3 : A.lv.N2 ? 2 : 1; }
function checks(){
  const a = A, m = a.r.margins, d = a.d, aatoMax = Math.max.apply(null, a.aato), out = [];
  const tr = Math.min(m['Ato: tração (fibra inf.)'], m['Ato: tração (fibra sup.)']);
  out.push({k: 'ato_t', t: 'Ato · tração ≤ 1,2·fct,m,j', v: 'σ = ' + f(d.ft_ato - tr, 2) + ' MPa (limite ' + f(d.ft_ato, 2) + ')', s: tr >= 0 ? 'ok' : 'warn', c: tr >= 0 ? 'Atende' : 'Passiva ' + f(aatoMax, 1) + ' cm²'});
  out.push({k: 'ato_c', t: 'Ato · compressão ≤ 0,7·fcj', v: 'σ = ' + f(m['Ato: compressão'] + a.r.lim.ato_c, 2) + ' MPa (limite ' + f(a.r.lim.ato_c, 2) + ')', s: m['Ato: compressão'] >= 0 ? 'ok' : 'bad', c: m['Ato: compressão'] >= 0 ? 'Atende' : 'Não atende'});
  const nv = d.nivel || 3, lvc = a.lv;
  if (nv === 1){
    const b1 = n1Section(d, a.r, a.iB, true, d.nB1, d.phiN1), v1 = n1Section(d, a.r, a.isp, false, d.nV1, d.phiN1);
    const w = Math.max(b1.cracked && b1.wk ? b1.wk : 0, v1.cracked && v1.wk ? v1.wk : 0);
    out.push({k: 'w', t: 'ELS-W · abertura de fissuras wk ≤ 0,2 mm (nível 1)', v: (b1.cracked || v1.cracked ? 'wk = ' + f(w, 3) + ' mm (limite 0,2)' : 'seção não fissurada (limite wk 0,2 mm)'), s: w <= 0.2 ? 'ok' : 'bad', c: w <= 0.2 ? 'Atende' : 'Não atende'});
  } else {
    const dv = nv === 3 ? lvc.N3d : lvc.N2d, fv = nv === 3 ? lvc.N3f : lvc.N2f;
    out.push({k: 'd', t: 'ELS-D · descompressão, comb. ' + (nv === 3 ? 'frequente' : 'quase permanente'), v: 'σ máx = ' + f(-dv, 2) + ' MPa (limite 0)', s: dv >= 0 ? 'ok' : 'bad', c: dv >= 0 ? 'Atende' : 'Não atende'});
    out.push({k: 'f', t: 'ELS-F · formação de fissuras, comb. ' + (nv === 3 ? 'rara' : 'frequente'), v: 'σ máx = ' + f(lvc.ft - fv, 2) + ' MPa (limite ' + f(lvc.ft, 2) + ')', s: fv >= 0 ? 'ok' : 'bad', c: fv >= 0 ? 'Atende' : 'Não atende'});
  }
  const ce = m['ELS-CE compressão (CR)'];
  out.push({k: 'ce', t: 'ELS-CE · compressão excessiva', v: 'σ mín = ' + f(ce + a.r.lim.ce, 2) + ' MPa (limite ' + f(a.r.lim.ce, 2) + ')', s: ce >= 0 ? 'ok' : 'bad', c: ce >= 0 ? 'Atende' : 'Não atende'});
  [['B', a.eluB], ['vão', a.eluV]].forEach(([n, e]) => out.push({k: 'elu' + n, t: 'ELU flexão · ' + (n === 'B' ? 'apoio B' : 'vão'), v: 'MRd/|Msd| = ' + f(e.ratio, 2) + ' (limite 1,00)' + (e.ductile ? '' : ' · x/d ' + f(e.xd, 2) + ' (limite 0,45)'), s: e.ok && e.yieldP ? (e.ductile ? 'ok' : 'warn') : 'bad', c: !e.ok ? 'Não atende' : !e.yieldP ? 'Aço não escoa' : e.ductile ? 'Atende' : 'Aumentar A′ (x/d > 0,45)'}));
  const vmax = Math.max.apply(null, a.sh.Vsd);
  out.push({k: 'v', t: 'Cortante · Vsd ≤ VRd2', v: 'Vsd = ' + f(vmax, 0) + ' kN (limite ' + f(a.sh.Vu, 0) + ')', s: vmax <= a.sh.Vu ? 'ok' : 'bad', c: vmax <= a.sh.Vu ? 'Atende' : 'Não atende'});
  const dl = Math.max.apply(null, a.df.qp_inf.slice(0, 21).map(Math.abs)) * 1000, lim = d.L * 1000 / 250;
  out.push({k: 'fl', t: 'Flecha quase permanente ×(1+φ) ≤ L/250', v: 'δ = ' + f(dl, 1) + ' mm (limite ' + f(lim, 0) + ')', s: dl <= lim ? 'ok' : 'bad', c: dl <= lim ? 'Atende' : 'Não atende'});
  return out;
}

/* ---------- armadura passiva por zona (apoio B: |x−L| ≤ 1 m; vão: demais seções; ancoragem sem passiva) ---------- */
function pickBars(Acm2){
  if (!(Acm2 > 0.01)) return null;
  let best = null;
  [8, 10, 12.5, 16, 20, 25].forEach(ph => { const a = barArea(ph);
    for (let n = 2; n <= 6; n++) { if (n * a < Acm2 - 0.01) continue; const ex = n * a - Acm2; if (!best || ex < best.ex - 1e-9) best = {n, ph, ex, A: n * a}; break; } });
  return best;
}
function passiveAt(x){
  const d = A.d, L = d.L, zB = Math.abs(x - L) <= 1 + 1e-9, nearEnd = x < 1 - 1e-9 || x > 2 * L - 1 + 1e-9;
  if (nearEnd) return {top: null, bot: null};
  if (zB) {
    let ato = 0; for (let i = 0; i < A.aato.length; i++) if (Math.abs(A.r.x[i] - L) <= 1 + 1e-9) ato = Math.max(ato, A.aato[i]);
    return {top: pickBars(d.AstB), bot: pickBars(Math.max(d.AscB, ato))};
  }
  return {top: pickBars(d.AscV), bot: pickBars(d.AstV)};
}
const barTxt = b => b ? b.n + ' Ø' + f(b.ph, b.ph % 1 ? 1 : 0) + ' (' + f(b.A, 2) + ' cm²)' : '—';
/* ---------- cortes na seção: cablagem e passiva ---------- */
function cutBox(x, title, sel){
  const d = A.d, e = cable(d, [x]).e[0], hc = d.h * 100, bc = d.bw * 100, yc = hc / 2 + e * 100;
  const nc = d.n_cab, ns = d.n_cord, rb = d.d_bain * 50, rs = 0.635, sp = Math.max(9, 2 * rb + 1.5);
  let g = '<rect x="0" y="0" width="' + bc + '" height="' + hc + '" fill="var(--surface)" stroke="var(--ink2)" stroke-width="0.9"/>' +
    '<rect x="' + d.cnom * 100 + '" y="' + d.cnom * 100 + '" width="' + (bc - 2 * d.cnom * 100) + '" height="' + (hc - 2 * d.cnom * 100) + '" fill="none" stroke="var(--s3)" stroke-width="0.6" stroke-dasharray="2 1.5"/>' +
    '<line x1="-3" x2="' + (bc + 3) + '" y1="' + hc / 2 + '" y2="' + hc / 2 + '" stroke="var(--muted)" stroke-width="0.5" stroke-dasharray="3 2"/>' +
    '<text x="' + (bc + 3.5) + '" y="' + (hc / 2 + 1.2) + '" font-size="3.4">CG</text>';
  for (let i = 0; i < nc; i++) {
    const cx = bc / 2 + (i - (nc - 1) / 2) * sp;
    g += '<circle cx="' + cx.toFixed(2) + '" cy="' + yc.toFixed(2) + '" r="' + rb.toFixed(2) + '" fill="var(--accent-soft)" stroke="var(--s2)" stroke-width="0.9"/>';
    const rr = ns === 1 ? 0 : Math.max(0.1, Math.min(1.1, rb - rs - 0.4));
    const ring = ns > 7 ? ns - 1 : ns;
    if (ns > 7) g += '<circle cx="' + cx.toFixed(2) + '" cy="' + yc.toFixed(2) + '" r="' + rs + '" fill="var(--s1)"/>';
    if (ns === 1) g += '<circle cx="' + cx.toFixed(2) + '" cy="' + yc.toFixed(2) + '" r="' + rs + '" fill="var(--s1)"/>';
    else for (let k = 0; k < ring; k++) { const a = 2 * Math.PI * k / ring + 0.3; g += '<circle cx="' + (cx + rr * Math.cos(a)).toFixed(2) + '" cy="' + (yc + rr * Math.sin(a)).toFixed(2) + '" r="' + rs + '" fill="var(--s1)"/>'; }
  }
  const ps = passiveAt(x), edge = (d.cnom + d.phi_t) * 100;
  [[ps.top, 'top'], [ps.bot, 'bot']].forEach(([b, face]) => { if (!b) return; const r = b.ph / 20 * 1.6, y = face === 'top' ? edge + r : hc - edge - r, x0 = edge + r, x1 = bc - edge - r;
    for (let k = 0; k < b.n; k++) g += '<circle cx="' + (b.n === 1 ? bc / 2 : x0 + (x1 - x0) * k / (b.n - 1)).toFixed(2) + '" cy="' + y.toFixed(2) + '" r="' + r.toFixed(2) + '" fill="var(--s4)" stroke="var(--surface)" stroke-width="0.3"/>'; });
  g += '<text x="' + bc / 2 + '" y="-2" text-anchor="middle" font-size="3.6">' + f(bc, 0) + '</text><text x="-2.5" y="' + hc * 0.22 + '" text-anchor="middle" font-size="3.6" transform="rotate(-90 -2.5 ' + hc * 0.22 + ')">' + f(hc, 0) + '</text>';
  const fb = hc - yc;
  return '<div class="cut' + (sel ? ' sel' : '') + '"><div class="t">' + title + '</div><svg viewBox="-9 -7 ' + (bc + 20) + ' ' + (hc + 12) + '" role="img" aria-label="Seção em x = ' + f(x, 2) + ' m">' + g + '</svg>' +
    '<div class="m">x = ' + f(x, 2) + ' m · e = ' + (e >= 0 ? '+' : '−') + f(Math.abs(e), 3) + ' m<br>cabos a ' + f(fb, 1) + ' cm da base<br>passiva sup.: ' + barTxt(ps.top) + '<br>passiva inf.: ' + barTxt(ps.bot) + '</div></div>';
}

      '<div class="grid2"><div class="card"><h2>Nível 1: seção fissurada</h2><p class="lead">Flexo-compressão com N∞ como força externa e M = Mext(comb. frequente) + M_P. Abertura de fissuras pelo menor dos dois valores do item 17.3.3.2. Informe as barras tracionadas nos dados (Nível 1).</p>' +
      table(['Grandeza', 'Apoio B', 'Vão'], [
        {c: ['Barras tracionadas', d.nB1 + ' Ø' + d.phiN1, d.nV1 + ' Ø' + d.phiN1]}, {c: ['As (cm²)', f(n1B.As, 2), f(n1V.As, 2)]}, {c: ['M = Mext + M_P (kN·m)', f(n1B.M, 1), f(n1V.M, 1)]}, {c: ['N∞ (kN)', f(n1B.N, 0), f(n1V.N, 0)]},
        {c: ['Tração máx. na comb. frequente (MPa)', f(n1B.sTen, 2), f(n1V.sTen, 2)]}, {c: ['Seção fissurada?', n1B.cracked ? 'sim' : 'não', n1V.cracked ? 'sim' : 'não']},
        {c: ['σs na armadura (MPa)', n1B.sig === null || n1B.sig === undefined ? '—' : f(n1B.sig, 1), n1V.sig === null || n1V.sig === undefined ? '—' : f(n1V.sig, 1)]},
        {c: ['wk (mm)', n1B.cracked && n1B.wk !== undefined ? f(n1B.wk, 3) : '—', n1V.cracked && n1V.wk !== undefined ? f(n1V.wk, 3) : '—'], hl: 1}, {c: ['wk ≤ 0,2 mm?', n1B.cracked ? ok(wB <= wlim) : chip('ok', 'não fissurada'), n1V.cracked ? ok(wV <= wlim) : chip('ok', 'não fissurada')]}]) + '</div>' +
      '<div class="card"><h2>Passiva exigida no ELU</h2><p class="lead">Armadura passiva tracionada em barras Ø16 para MRd ≥ Msd com x/d ≤ 0,45, por compatibilidade de deformações com a protensão atual.</p>' +
      table(['Grandeza', 'Apoio B', 'Vão'], [{c: ['Barras Ø16 necessárias', needB.ok ? needB.n : '> 14', needV.ok ? needV.n : '> 14']}, {c: ['As (cm²)', needB.ok ? f(needB.As, 2) : '—', needV.ok ? f(needV.As, 2) : '—']},
        {c: ['MRd (kN·m)', f(needB.Mrd, 0), f(needV.Mrd, 0)]}, {c: ['Msd (kN·m)', f(needB.Msd, 0), f(needV.Msd, 0)]}, {c: ['x/d', f(needB.xd, 2), f(needV.xd, 2)]}]) +
      '<p class="foot">Com protensão forte (nível 3) a passiva tracionada costuma ser zero, e o ELU é controlado pela passiva comprimida A′ da aba Ruptura.</p></div></div>',
    after(){ const t = lv.t; const mxS = a => x.map((_, i) => Math.max(a[0][i], a[1][i]));
      chart($('#c1'), {series: [{name: 'Quase permanente (ψ2)', x, y: mxS(t.cqp), color: C.s1, d: 2}, {name: 'Frequente (ψ1)', x, y: mxS(t.cf), color: C.s2, d: 2}, {name: 'Rara', x, y: mxS(t.cr), color: C.s3, d: 2}],
        refs: [{y: 0, label: '0 (descompressão)'}, {y: lv.ft, label: '1,2·fctk,inf'}], height: 300, xlab: 'x (m)', ylab: 'σ de tração máx. (MPa)', yd: 1, vd: 2, unit: 'MPa', tx: x, title: 'Tração por combinação'}); }
  };
};

PANELS.ca = function(){
  const rc = A.rc, d = A.d, ap = d.Ap * 1e4, aato = Math.max.apply(null, A.aato);
  const pcMax = Math.min.apply(null, A.df.qp_inf.slice(0, 21)) * 1000;
  const rows = [
    {c: ['Md no apoio B (kN·m)', f(rc.Md_neg, 0), f(Math.abs(A.eluB.Msd), 0)]}, {c: ['Md no vão, x = ' + f(rc.x_pos, 1) + ' m (kN·m)', f(rc.Md_pos, 0), f(A.eluV.Msd, 0)]},
    {c: ['Armadura de flexão no apoio B (cm²)', f(rc.neg.As, 1), "A′ = " + f(d.AscB, 2)]}, {c: ['Armadura de flexão no vão (cm²)', f(rc.pos.As, 1), "A′ = " + f(d.AscV, 2)]},
    {c: ['Armadura ativa Ap (cm²)', '—', f(ap, 2)]}, {c: ['Passiva no ato As,ato (cm²)', '—', f(aato, 1)]},
    {c: ['Barras adotadas (B / vão)', d.nnegCA + ' Ø' + d.phiCA + ' = ' + f(rc.As_neg, 1) + ' cm²', '—'], hl: 0}, {c: ['', d.nposCA + ' Ø' + d.phiCA + ' = ' + f(rc.As_pos, 1) + ' cm²', '—']},
    {c: ['wk no apoio B, comb. frequente (mm)', f(rc.els.neg.wk, 2), 'fuso e tensões (aba Tensões)']}, {c: ['Flecha imediata (mm)', f(rc.defl_inst * 1000, 1), f(mm1(A.df.qp_net), 1) + ' (líquida)']},
    {c: ['Flecha total (mm)', f(rc.defl_tot * 1000, 1), f(pcMax, 1) + ' (×(1+φ))']}, {c: ['Vsd no apoio B (kN)', f(rc.Vsd_B, 0), f(Math.max.apply(null, A.sh.Vsd), 0)]},
    {c: ['asw total no apoio B (cm²/m)', f(rc.asw_B, 1), f(2 * Math.max.apply(null, A.sh.asw_calc), 1)]}];
  function mm1(a){ return a.slice(0, 21).reduce((m, v) => Math.abs(v) > Math.abs(m) ? v : m, 0) * 1000; }
  const x = xsOf().slice(0, 21);
  return {
    html: '<div class="card"><h2>Concreto protendido × concreto armado</h2><div class="src">Planilha: CA e CA_Flecha · mesma seção e mesmas cargas</div><p class="lead">ELU pelo bloco retangular 0,8x·0,85·fcd, sem redistribuição. Abertura de fissuras pelo item 17.3.3.2 na comb. frequente. Flecha por Branson com integração ao longo do vão. Barras e altura útil vêm dos dados (Concreto armado).</p>' +
      table(['Grandeza', 'Concreto armado', 'Concreto protendido'], rows) + '</div>' +
      '<div class="card"><h2>Flecha imediata do concreto armado, quase permanente</h2><div id="c1"></div><p class="foot">As,mín = ' + f(rc.As_min, 1) + ' cm² · Mr = ' + f(rc.Mr, 0) + ' kN·m · α_f = ' + f(rc.alpha_f, 2) + '</p></div>',
    after(){ chart($('#c1'), {series: [{name: 'CA, imediata', x, y: rc.yi.slice(0, 21).map(v => v * 1000), color: C.s2, d: 2}, {name: 'PC, líquida', x, y: A.df.qp_net.slice(0, 21).map(v => v * 1000), color: C.s1, d: 2}], invertY: true, height: 260, xlab: 'x (m)', ylab: 'δ (mm), + para baixo', yd: 0, vd: 2, unit: 'mm', tx: x, title: 'Flecha CA e PC'}); }
  };
};

function renderPanel(){
  if (!A) return;
  const p = PANELS[tab](); const host = $('#panel'); host.innerHTML = p.html; if (p.after) p.after();
}
let rt = null; window.addEventListener('resize', () => { clearTimeout(rt); rt = setTimeout(renderPanel, 150); });

/* ---------- inicialização ---------- */
buildTabs(); buildSide(); compute(); if (A) { renderStatus(); renderPanel(); }
})();
</script>
